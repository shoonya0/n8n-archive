name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (workflow JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  integration:
    name: Integration tests (n8n in Docker)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create .env with a throwaway encryption key
        run: |
          cp .env.example .env
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
      - run: npm run n8n:up
      - run: npm run n8n:deploy
      - run: npm run test:integration
      - name: n8n logs on failure
        if: failure()
        run: docker compose logs n8n --tail=200
      - name: Stop n8n
        if: always()
        run: docker compose down -v
